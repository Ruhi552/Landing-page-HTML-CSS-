<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Cybersecurity</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #07110d;
            color: white;
        }

        header {
            background: #0b2017;
            padding: 40px;
            text-align: center;
            border-bottom: 2px solid #00d084;
        }

        header h1 {
            color: #00d084;
        }

        nav {
            background: #0d1813;
            padding: 18px;
            text-align: center;
        }

        nav a {
            color: #00d084;
            text-decoration: none;
            margin: 20px;
        }

        main {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .box {
            background: #10251a;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #174c30;
        }

        .number {
            font-size: 35px;
            color: #00d084;
            font-weight: bold;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 25px;
        }

        .gallery img {
            width: 100%;
            height: 230px;
            object-fit: cover;
            border-radius: 12px;
        }

        .video {
            margin-top: 30px;
        }

        iframe {
            width: 100%;
            height: 400px;
            border: none;
            border-radius: 15px;
        }

        footer {
            background: #0d1813;
            color: #00d084;
            text-align: center;
            padding: 20px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

<header>
    <h1>🔐 AI Cybersecurity</h1>
    <p>Artificial Intelligence for Digital Security</p>
</header>

<nav>
    <a href="#dashboard">Dashboard</a>
    <a href="#images">Security</a>
    <a href="#video">Video</a>
</nav>

<main>

<section id="dashboard">

    <h2>Security Dashboard</h2>

    <div class="dashboard">

        <div class="box">
            <h3>Threats Detected</h3>
            <p class="number">128</p>
        </div>

        <div class="box">
            <h3>Blocked Attacks</h3>
            <p class="number">96</p>
        </div>

        <div class="box">
            <h3>Safe Systems</h3>
            <p class="number">450</p>
        </div>

    </div>

</section>

<section id="images">

    <h2>AI Cybersecurity</h2>

    <div class="gallery">

        <img src="https://images.unsplash.com/photo-1558494949-ef010cbdcc31">

        <img src="https://images.unsplash.com/photo-1563013544-824ae1b704d3">

        <img src="https://images.unsplash.com/photo-1563986768609-322da13575f3">

        <img src="https://images.unsplash.com/photo-1510511459019-5dda7724fd87">

    </div>

</section>

<section id="video" class="video">

    <h2>AI Cybersecurity Video</h2>

    <iframe
        src="https://www.youtube.com/embed/4hZxEwUJiFk"
        allowfullscreen>
    </iframe>

</section>

</main>

<footer>
    <p>AI Cybersecurity Project</p>
</footer>

</body>
</html>
