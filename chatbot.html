<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #eef0ff;
        }

        header {
            background: linear-gradient(120deg, #6546e8, #a855f7);
            color: white;
            text-align: center;
            padding: 30px;
        }

        nav {
            background: white;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: #6546e8;
            text-decoration: none;
            margin: 15px;
        }

        main {
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        section {
            background: white;
            padding: 25px;
            margin: 20px 0;
            border-radius: 15px;
        }

        .chat {
            background: #f3e8ff;
            padding: 15px;
            margin: 10px;
            border-radius: 15px;
        }

        .gallery {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .gallery img {
            width: 45%;
            height: 160px;
            object-fit: cover;
            border-radius: 12px;
        }

        iframe {
            width: 100%;
            height: 350px;
            border: 0;
            border-radius: 12px;
        }

        footer {
            background: #6546e8;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

<header>
    <h1>AI Chatbot</h1>
    <p>Tomar Smart AI Assistant</p>
</header>

<nav>
    <a href="#home">Home</a>
    <a href="#gallery">Gallery</a>
    <a href="#video">Video</a>
</nav>

<main>

<section id="home">
    <h2>AI Chatbot</h2>

    <div class="chat">
        <b>You:</b>
        <p>AI ki amake porashonay help korte pare?</p>
    </div>

    <div class="chat">
        <b>AI:</b>
        <p>Hae, AI question answer ebong learning-e help korte pare.</p>
    </div>
</section>

<section id="gallery">
    <h2>AI Chatbot Gallery</h2>

    <div class="gallery">
        <img src="https://images.unsplash.com/photo-1677442136019-21780ecad995">
        <img src="https://images.unsplash.com/photo-1485827404703-89b55fcc595e">
        <img src="https://images.unsplash.com/photo-1535378917042-10a22c95931a">
        <img src="https://images.unsplash.com/photo-1620712943543-bcc4688e7485">
    </div>
</section>

<section id="video">
    <h2>AI Chatbot Video</h2>

    <iframe
        src="https://www.youtube.com/embed/Y9YbX7FPIhQ"
        title="AI Chatbot Video"
        allowfullscreen>
    </iframe>
</section>

</main>

<footer>
    <p>AI Chatbot Project</p>
</footer>

</body>
</html>
